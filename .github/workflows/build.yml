name: Build

# Unsigned builds need no secrets. Optional signing secrets (all may be absent):
#   MAC_CSC_LINK, MAC_CSC_KEY_PASSWORD             macOS Developer ID certificate (.p12, base64)
#   APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD, APPLE_TEAM_ID   macOS notarization
#   WIN_CSC_LINK, WIN_CSC_KEY_PASSWORD             Windows code signing certificate
on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  NODE_VERSION: '20'
  ELECTRON_CACHE: ${{ github.workspace }}/.cache/electron
  ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/.cache/electron-builder

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macos-latest = Apple Silicon (arm64), macos-15-intel = x64
        os: [ubuntu-latest, windows-latest, macos-latest, macos-15-intel]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Unit tests
        run: npm test
      - name: Core smoke test (manifest, libraries/natives, launch args for this OS — no game)
        run: npm run smoke

  build:
    name: Build (${{ matrix.name }})
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-latest
            args: --linux
          - name: windows
            os: windows-latest
            args: --win
          # Both mac architectures from one runner → one latest-mac.yml for the updater
          - name: macos
            os: macos-latest
            args: --mac
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - uses: actions/cache@v4
        with:
          path: .cache
          key: electron-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npm ci
      - name: Build installers
        shell: bash
        # electron-builder treats empty CSC_* / WIN_CSC_* as a file path and fails.
        # Unset them when secrets are absent so the build stays unsigned.
        run: |
          [ -z "${CSC_LINK:-}" ] && unset CSC_LINK
          [ -z "${CSC_KEY_PASSWORD:-}" ] && unset CSC_KEY_PASSWORD
          [ -z "${APPLE_ID:-}" ] && unset APPLE_ID
          [ -z "${APPLE_APP_SPECIFIC_PASSWORD:-}" ] && unset APPLE_APP_SPECIFIC_PASSWORD
          [ -z "${APPLE_TEAM_ID:-}" ] && unset APPLE_TEAM_ID
          [ -z "${WIN_CSC_LINK:-}" ] && unset WIN_CSC_LINK
          [ -z "${WIN_CSC_KEY_PASSWORD:-}" ] && unset WIN_CSC_KEY_PASSWORD
          npx electron-builder --config electron-builder.config.js ${{ matrix.args }} --publish never
        env:
          # Auto-update feed = the repository the workflow runs in (forks update from themselves)
          FORJA_UPDATE_REPO: ${{ github.repository }}
          CSC_LINK: ${{ matrix.name == 'macos' && secrets.MAC_CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ matrix.name == 'macos' && secrets.MAC_CSC_KEY_PASSWORD || '' }}
          APPLE_ID: ${{ matrix.name == 'macos' && secrets.APPLE_ID || '' }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ matrix.name == 'macos' && secrets.APPLE_APP_SPECIFIC_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ matrix.name == 'macos' && secrets.APPLE_TEAM_ID || '' }}
          WIN_CSC_LINK: ${{ matrix.name == 'windows' && secrets.WIN_CSC_LINK || '' }}
          WIN_CSC_KEY_PASSWORD: ${{ matrix.name == 'windows' && secrets.WIN_CSC_KEY_PASSWORD || '' }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: List artifacts
        shell: bash
        run: ls -la dist
      - uses: actions/upload-artifact@v4
        with:
          name: forja-${{ matrix.name }}
          if-no-files-found: error
          retention-days: 14
          path: |
            dist/*.AppImage
            dist/*.deb
            dist/*.tar.gz
            dist/*.exe
            dist/*.zip
            dist/*.dmg
            dist/*.blockmap
            dist/latest*.yml

  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Tag must match package.json version
        shell: bash
        run: |
          v="$(node -p "require('./package.json').version")"
          if [ "v$v" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package.json version v$v"; exit 1
          fi
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: forja-*
          merge-multiple: true
      - run: ls -la artifacts
      - uses: softprops/action-gh-release@v2
        with:
          name: Forja Launcher ${{ github.ref_name }}
          files: artifacts/*
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: true
